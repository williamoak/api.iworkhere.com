
name: joinaunion

services:
  api:
    image: api-pro.iworkhere.com
    container_name: api-pro.iworkhere.com

    user: "www-data:local"
    init: true
    restart: unless-stopped

    env_file:
      - .env.docker.public

    environment:
      NODE_ENV: production
      PORT: "4201"
      HOST_IP: "0.0.0.0"
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      DB_CERT_DIR: /run/secrets/cockroach
      SECRETS_DIR: /run/secrets/api
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    ports:
      - "192.168.0.2:4201:4201"

    volumes:
      - type: bind
        source: /data/secrets/cockroach
        target: /run/secrets/cockroach
        read_only: true
      - type: bind
        source: /data/secrets/api
        target: /run/secrets/api
        read_only: true

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

  redis:
    image: redis:7.4-bookworm
    container_name: joinaunion-redis

    user: "33:1001"
    init: true
    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        umask 077
        password="$$(cat /run/secrets/redis-password)"
        printf 'requirepass "%s"\n' "$$password" > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf \
          --save "" \
          --appendonly no \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru

    volumes:
      - type: bind
        source: /data/secrets/redis-password
        target: /run/secrets/redis-password
        read_only: true

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis-password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - backend

networks:
  backend:
    driver: bridge
